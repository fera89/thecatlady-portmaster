; ---------------------------------------------------------------------------
; The Cat Lady — R36S runtime override config (spec §15, §16, §21)
;
; This file is passed to the engine with `--conf` so the user's original Steam
; acsetup.cfg is never modified. stage-runtime.sh copies it to
;   port/thecatlady/thecatlady/config/acsetup.cfg
;
; Verified game facts (from the Steam acsetup.cfg):
;   native resolution = 800x600, 32-bit colour, 4:3
; R36S panel = 640x480, 4:3  ->  uniform 0.8x downscale, NO aspect distortion,
; NO letterboxing/pillarboxing. Proportional scaling fills the whole screen.
; ---------------------------------------------------------------------------

[graphics]
; Profile 1 (default, spec §15): software renderer first — most compatible for
; a 2D AGS game on Mali-G31. Switch to OGL only if a problem is demonstrated.
driver=Software
windowed=0
screen_def=max
; proportional = keep 4:3 aspect and scale to fit (here: exact 0.8x to 640x480).
game_scale_fs=proportional
; Scaling is done by SDL's GPU renderer (opengles2), so the filter cost is on
; the Mali GPU, not the CPU. 'linear' gives a smoother 0.8x downscale of this
; hi-res hand-painted art (no measurable CPU cost difference vs nearest).
filter=linear
vsync=1
render_at_screenres=0

[sound]
; -1 = let the engine auto-select the SDL audio backend (spec §21: prefer default).
digiid=-1
midiid=-1
threaded=1

[misc]
; Sprite cache in KB. Game default was 131072 (128 MB). The device has 1 GB RAM;
; keep the game default for correctness first, then tune ONLY after measuring
; VmRSS/VmHWM on-device (spec §22). Lower conservatively if OOM is observed.
cachemax=131072
; Smooth scaled sprites/fonts (game default was 0). Softens the "rustic" look
; of text once the 800x600 image is downscaled to 640x480.
antialias=1
; Keep saves/logs out of the game-data dir; the launcher sets XDG_DATA_HOME.

[language]
; Default language = English (blank). This is only a DEFAULT: our --conf is the
; lowest-priority config, so whatever language the player picks in-game is saved
; to the user config (saves/ags/<game>/acsetup.cfg) and overrides this on the
; next launch (AGS writes "language/translation" on exit). So: English out of
; the box, but the player's choice persists.
translation=

[mouse]
; The gamepad drives an emulated mouse/keyboard via gptokeyb (see controls/).
auto_lock=0
speed=1
